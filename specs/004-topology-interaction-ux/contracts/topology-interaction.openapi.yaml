openapi: 3.1.0
info: {title: NetLab Topology Interaction Additions, version: 1.0.0}
paths:
  /api/v1/labs/{labId}/placements:
    put:
      operationId: updateTopologyPlacements
      parameters:
        - {name: labId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlacementBatch'}
      responses:
        '200': {description: Updated shared placements and laboratory revision}
        '409': {description: Revision conflict}
        '422': {description: Invalid resource or coordinate}
  /api/v1/links/{linkId}/reconnect:
    post:
      operationId: reconnectLink
      parameters:
        - {name: linkId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retained_endpoint_id, replacement_endpoint_id]
              properties:
                retained_endpoint_id: {type: string, format: uuid}
                replacement_endpoint_id: {type: string, format: uuid}
      responses:
        '202': {description: Durable reconnect task; original link remains authoritative until success}
        '409': {description: Endpoint unavailable, duplicate link, or revision conflict}
components:
  schemas:
    TopologyPlacement:
      type: object
      required: [resource_id, resource_type, x, y, revision]
      properties:
        resource_id: {type: string, format: uuid}
        resource_type: {enum: [node, network_object]}
        x: {type: number}
        y: {type: number}
        revision: {type: integer, minimum: 1}
    PlacementBatch:
      type: object
      required: [placements]
      properties:
        placements:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/PlacementUpdate'}
    PlacementUpdate:
      type: object
      required: [resource_id, resource_type, x, y]
      properties:
        resource_id: {type: string, format: uuid}
        resource_type: {enum: [node, network_object]}
        x: {type: number}
        y: {type: number}
        revision: {type: integer, minimum: 1}
