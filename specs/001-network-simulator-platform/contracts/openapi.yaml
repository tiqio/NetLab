openapi: 3.1.0
info:
  title: NetLab API
  version: 1.0.0
  description: Shared single-host network-simulator control API.
servers:
  - url: /api/v1
security: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200': {description: Capabilities and configured limits, content: {application/json: {schema: {type: object}}}}
  /runtime-ownership:
    get:
      operationId: listRuntimeOwnership
      description: Lists persisted host-runtime objects used for recovery and leak verification.
      responses:
        '200': {description: Runtime ownership records, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RuntimeOwnershipRecord'}}}}}
  /templates:
    get:
      operationId: listTemplates
      responses:
        '200': {description: Templates, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeviceTemplate'}}}}}
  /images:
    get:
      operationId: listImages
      responses:
        '200': {description: Images, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ImageVersion'}}}}}
    post:
      operationId: importImage
      description: Stream or register an operator-supplied image; never downloads commercial images automatically.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [source_type, source_reference, license_notes], properties: {source_type: {enum: [upload, local_import, oci_registry]}, source_reference: {type: string}, expected_sha256: {type: string}, license_notes: {type: string}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /labs:
    get:
      operationId: listLabs
      responses:
        '200': {description: Labs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Laboratory'}}}}}
    post:
      operationId: createLab
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateLab'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Laboratory'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /labs/{labId}:
    parameters: [{$ref: '#/components/parameters/LabId'}]
    get:
      operationId: getLab
      responses:
        '200': {description: Complete topology snapshot, headers: {X-Event-Sequence: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/LabSnapshot'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateLab
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {type: object}}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Laboratory'}}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      operationId: deleteLab
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {description: Node created with authoritative placement, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNodeResult'}}}}
        '409': {description: Idempotency conflict}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {description: If-Match is required}
  /labs/{labId}/nodes:
    parameters: [{$ref: '#/components/parameters/LabId'}]
    post:
      operationId: createNode
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNode'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /labs/{labId}/links:
    parameters: [{$ref: '#/components/parameters/LabId'}]
    post:
      operationId: connectLink
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [endpoint_a_id, endpoint_b_id], properties: {endpoint_a_id: {type: string, format: uuid}, endpoint_b_id: {type: string, format: uuid}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /labs/{labId}/placements:
    parameters: [{$ref: '#/components/parameters/LabId'}]
    put:
      operationId: updateTopologyPlacements
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlacementBatch'}}}}
      responses:
        '200': {description: Updated shared placements, content: {application/json: {schema: {$ref: '#/components/schemas/TopologyPlacementResult'}}}}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /labs/{labId}/exports:
    parameters: [{$ref: '#/components/parameters/LabId'}]
    post:
      operationId: exportLab
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /lab-imports:
    post:
      operationId: importLab
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, description: Redacted LaboratoryExport bundle}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /nodes/{nodeId}:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: getNode
      responses:
        '200': {description: Node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
    delete:
      operationId: deleteNode
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /nodes/{nodeId}/state:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    put:
      operationId: setNodeState
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [desired_state], properties: {desired_state: {enum: [running, stopped]}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /nodes/{nodeId}/interfaces:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: addInterface
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [driver], properties: {driver: {type: string}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /interfaces/{interfaceId}:
    delete:
      operationId: removeInterface
      parameters: [{name: interfaceId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /links/{linkId}:
    delete:
      operationId: disconnectLink
      parameters: [{name: linkId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /links/{linkId}/reconnect:
    post:
      operationId: reconnectLink
      parameters: [{name: linkId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [retained_endpoint_id, replacement_endpoint_id], properties: {retained_endpoint_id: {type: string, format: uuid}, replacement_endpoint_id: {type: string, format: uuid}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /nodes/{nodeId}/guest-exec:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: executeGuestCommand
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [argv], properties: {argv: {type: array, minItems: 1, items: {type: string}}, timeout_seconds: {type: integer, minimum: 1, maximum: 3600}, output_limit_bytes: {type: integer, minimum: 1024, maximum: 10485760}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /nodes/{nodeId}/port-mappings:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodePortMappings
      responses:
        '200': {description: Durable host port mappings owned by the node, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PortMapping'}}}}}
    post:
      operationId: createPortMapping
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePortMapping'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /port-mappings/{mappingId}:
    delete:
      operationId: deletePortMapping
      parameters: [{name: mappingId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /nodes/{nodeId}/consoles:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: listNodeConsoles
      responses:
        '200': {description: Console descriptors, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ConsoleDescriptor'}}}}}
  /captures:
    get:
      operationId: listCaptures
      parameters: [{name: laboratory_id, in: query, schema: {type: string, format: uuid}}, {name: include_internal, in: query, schema: {type: boolean, default: false}}]
      responses:
        '200': {description: Capture sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CaptureSession'}}}}}
    post:
      operationId: startCapture
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartCapture'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /captures/{captureId}:
    get:
      operationId: getCapture
      parameters: [{name: captureId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Capture metadata, content: {application/json: {schema: {$ref: '#/components/schemas/CaptureSession'}}}}
    delete:
      operationId: stopCapture
      parameters: [{name: captureId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /captures/{captureId}/stream:
    get:
      operationId: streamCapture
      parameters: [{name: captureId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Live packet stream, content: {application/vnd.tcpdump.pcap: {schema: {type: string, contentMediaType: application/vnd.tcpdump.pcap}}}}
  /client-tools/wireshark-helper/{platform}:
    get:
      operationId: downloadWiresharkHelper
      parameters:
        - name: platform
          in: path
          required: true
          schema: {enum: [linux-amd64, windows-amd64, darwin-amd64, darwin-arm64]}
      responses:
        '200':
          description: Platform-specific NetLab Wireshark helper executable
          headers:
            X-Checksum-SHA256: {schema: {type: string}}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '404': {description: Helper package unavailable for the requested platform}
  /traffic-filters:
    get:
      operationId: listTrafficFilters
      parameters: [{name: laboratory_id, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Traffic Filter sessions with ambiguity metadata, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: startTrafficFilter
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartTrafficFilter'}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /traffic-filters/{filterId}:
    get:
      operationId: getTrafficFilter
      parameters: [{name: filterId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Filter and observed path, content: {application/json: {schema: {type: object}}}}
    delete:
      operationId: stopTrafficFilter
      parameters: [{name: filterId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /tasks/{taskId}:
    get:
      operationId: getTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '200': {description: Task, content: {application/json: {schema: {$ref: '#/components/schemas/OperationTask'}}}}
  /tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      parameters: [{$ref: '#/components/parameters/TaskId'}]
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /artifacts/{artifactId}:
    get:
      operationId: downloadArtifact
      parameters: [{name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Artifact bytes, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
  /labs/{labId}/duplicate:
    post:
      operationId: duplicateLab
      parameters: [{$ref: '#/components/parameters/LabId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1}}}}}}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
  /tasks:
    get:
      operationId: listTasks
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000}}]
      responses:
        '200': {description: Durable operation tasks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/OperationTask'}}}}}
  /audit-events:
    get:
      operationId: listAuditEvents
      responses:
        '200': {description: Redacted audit events, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /nodes/{nodeId}/resources:
    get:
      operationId: getNodeResources
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200': {description: Configured limits and observed cgroup metrics, content: {application/json: {schema: {type: object}}}}
    put:
      operationId: updateNodeResources
      parameters: [{$ref: '#/components/parameters/NodeId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [cpu_count, cpu_quota_micros, memory_mib]}}}}
      responses:
        '200': {description: Updated node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /nodes/{nodeId}/settings:
    put:
      operationId: updateNodeSettings
      description: Update the name, restart-sensitive resources, interface drivers, and cloud-init network settings of a stopped node.
      parameters: [{$ref: '#/components/parameters/NodeId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cpu_count, cpu_quota_micros, memory_mib, interface_limit, process_limit]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                cpu_count: {type: integer, minimum: 1, maximum: 256}
                cpu_quota_micros: {type: integer, minimum: 0, description: Zero disables CPU-time limiting; 100000 equals one host CPU core per period.}
                memory_mib: {type: integer, minimum: 64}
                interface_limit: {type: integer, minimum: 1}
                process_limit: {type: integer, minimum: 1, maximum: 1048576}
                network_interfaces:
                  type: array
                  items:
                    type: object
                    required: [id, name, driver, modes, addresses]
                    properties:
                      id: {type: string, format: uuid}
                      name: {type: string}
                      driver: {enum: [virtio-net-pci, e1000, e1000e, vmxnet3]}
                      modes: {type: array, items: {enum: [dhcpv4, dhcpv6, slaac, static]}}
                      addresses: {type: array, items: {type: string}}
      responses:
        '200': {description: Updated stopped node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
        '409': {description: Node is not stopped, the revision changed, or the name conflicts}
  /nodes/{nodeId}/bootstrap-credentials:
    get:
      operationId: getNodeBootstrapCredentials
      description: Recover the initial username and plaintext password from a managed Ubuntu cloud-init seed ISO.
      parameters: [{$ref: '#/components/parameters/NodeId'}]
      responses:
        '200':
          description: Recoverable initial cloud-init credentials
          content:
            application/json:
              schema:
                type: object
                required: [username, password, source]
                properties:
                  username: {type: string}
                  password: {type: string}
                  source: {type: string, enum: [cloud-init-seed]}
        '404': {description: The node has no recoverable Ubuntu cloud-init credentials}
  /nodes/{nodeId}/consoles/{mode}/stream:
    get:
      operationId: streamNodeConsole
      parameters: [{$ref: '#/components/parameters/NodeId'}, {name: mode, in: path, required: true, schema: {enum: [ssh, telnet, vnc]}}, {name: session_id, in: query, required: false, schema: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}}]
      responses:
        '101': {description: WebSocket console stream}
  /nodes/{nodeId}/consoles/{mode}/sessions/{sessionId}:
    delete:
      operationId: closeNodeConsoleSession
      parameters: [{$ref: '#/components/parameters/NodeId'}, {name: mode, in: path, required: true, schema: {enum: [ssh, telnet, vnc]}}, {name: sessionId, in: path, required: true, schema: {type: string, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}}]
      responses:
        '204': {description: Console session closed or already absent}
  /labs/{labId}/network-objects:
    get:
      operationId: listNetworkObjects
      parameters: [{$ref: '#/components/parameters/LabId'}]
      responses:
        '200': {description: Network objects, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createNetworkObject
      parameters: [{$ref: '#/components/parameters/LabId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNetworkObject'}}}}
      responses:
        '202': {description: Network object admitted with authoritative placement and runtime task, content: {application/json: {schema: {$ref: '#/components/schemas/CreateNetworkObjectResult'}}}}
        '409': {description: Idempotency conflict}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {description: If-Match is required}
  /network-objects/{objectId}:
    get:
      operationId: getNetworkObject
      parameters: [{name: objectId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Network object}}
    patch:
      operationId: updateNetworkObject
      parameters: [{name: objectId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                config: {type: object}
      responses:
        '202': {$ref: '#/components/responses/AcceptedTask'}
        '412': {description: Network object revision changed}
    delete:
      operationId: deleteNetworkObject
      parameters: [{name: objectId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {$ref: '#/components/responses/AcceptedTask'}}
  /network-objects/{objectId}/attachments:
    post:
      operationId: attachNetworkObject
      parameters: [{name: objectId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [interface_id]}}}}
      responses: {'201': {description: Attachment created}}
  /network-objects/{objectId}/diagnostics:
    get:
      operationId: getNetworkObjectDiagnostics
      parameters: [{name: objectId, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Addressing, lease, forwarding, and NAT diagnostics}}
  /labs/{labId}/network-object-links:
    get:
      operationId: listNetworkObjectLinks
      parameters: [{$ref: '#/components/parameters/LabId'}]
      responses: {'200': {description: First-class links between namespace-backed network objects, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NetworkObjectLink'}}}}}}
    post:
      operationId: createNetworkObjectLink
      parameters: [{$ref: '#/components/parameters/LabId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_a_id, port_a_name, object_b_id, port_b_name]
              properties: {object_a_id: {type: string}, port_a_name: {type: string, minLength: 1, maxLength: 15}, object_b_id: {type: string}, port_b_name: {type: string, minLength: 1, maxLength: 15}}
      responses: {'201': {description: Network object link accepted, content: {application/json: {schema: {$ref: '#/components/schemas/NetworkObjectLink'}}}}}
  /network-object-links/{linkId}:
    delete:
      operationId: deleteNetworkObjectLink
      parameters: [{name: linkId, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Link and owned bridge/veth resources deleted live}}
components:
  parameters:
    LabId: {name: labId, in: path, required: true, schema: {type: string, format: uuid}}
    NodeId: {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: Quoted resource revision}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    AcceptedTask: {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/TaskEnvelope'}}}}
    Conflict: {description: Conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionFailed: {description: Revision mismatch, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Not found, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Laboratory:
      type: object
      required: [id, name, revision, recovery_policy, lifecycle_state]
      properties: {id: {type: string, format: uuid}, name: {type: string}, description: {type: string}, revision: {type: integer}, recovery_policy: {enum: [auto_restore, remain_stopped]}, lifecycle_state: {enum: [active, deleting, delete_failed]}}
    CreateLab:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 128}, description: {type: string, maxLength: 4096}, recovery_policy: {enum: [auto_restore, remain_stopped], default: auto_restore}}
    LabSnapshot:
      type: object
      required: [laboratory, nodes, interfaces, links, network_objects, network_object_links, placements, event_sequence]
      properties: {laboratory: {$ref: '#/components/schemas/Laboratory'}, nodes: {type: array, items: {$ref: '#/components/schemas/Node'}}, interfaces: {type: array, items: {$ref: '#/components/schemas/NodeInterface'}}, links: {type: array, items: {$ref: '#/components/schemas/Link'}}, network_objects: {type: array, items: {$ref: '#/components/schemas/NetworkObject'}}, network_object_links: {type: array, items: {$ref: '#/components/schemas/NetworkObjectLink'}}, placements: {type: array, items: {$ref: '#/components/schemas/TopologyPlacement'}}, event_sequence: {type: integer}}
    NetworkObjectLink:
      type: object
      required: [id, laboratory_id, object_a_id, port_a_name, object_b_id, port_b_name, revision, desired_state, observed_state]
      properties: {id: {type: string}, laboratory_id: {type: string}, object_a_id: {type: string}, port_a_name: {type: string}, object_b_id: {type: string}, port_b_name: {type: string}, revision: {type: integer}, desired_state: {enum: [connected, disconnected]}, observed_state: {enum: [pending, connected, failed]}, last_error: {$ref: '#/components/schemas/Problem'}}
