openapi: 3.1.0
info:
  title: NetLab Constitution Gap Closure API Delta
  version: 0.1.0
paths:
  /api/v1/capabilities:
    get:
      summary: Return platform capabilities and exact release identity
      operationId: getCapabilitiesWithReleaseIdentity
      responses:
        "200":
          description: Capability document for the deployed candidate
          content:
            application/json:
              schema:
                type: object
                required: [api_version, runtimes, features, release]
                properties:
                  api_version: { type: string }
                  runtimes:
                    type: array
                    items: { type: string }
                  features:
                    type: array
                    items: { type: string }
                  release:
                    $ref: "#/components/schemas/ReleaseIdentity"
  /api/v1/nodes/{nodeId}/capabilities:
    get:
      summary: Return observed runtime capabilities for one node
      operationId: getNodeCapabilities
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest per-capability observations
          content:
            application/json:
              schema:
                type: object
                required: [node_id, observations]
                properties:
                  node_id: { type: string }
                  observations:
                    type: array
                    items: { $ref: "#/components/schemas/RuntimeCapabilityObservation" }
        "404":
          description: Node not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/nodes/{nodeId}/guest-exec:
    post:
      summary: Execute a bounded command through the currently ready QEMU guest agent
      operationId: executeNodeGuestCommand
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [argv]
              properties:
                argv:
                  type: array
                  minItems: 1
                  items: { type: string }
                timeout_seconds: { type: integer, minimum: 1 }
                output_limit: { type: integer, minimum: 1 }
      responses:
        "202":
          description: Durable guest command accepted
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task: { $ref: "#/components/schemas/OperationTask" }
        "409":
          description: Current capability observation does not permit guest execution
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/labs/{labId}/network-objects:
    post:
      summary: Create a durable bridge, NAT, PC, or switch network object
      operationId: createNetworkObject
      parameters:
        - name: labId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind, config]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                kind: { enum: [bridge, nat_bridge, pc, switch_l2, switch_l3] }
                config: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Network object provisioning accepted
          content:
            application/json:
              schema:
                type: object
                required: [network_object, task]
                properties:
                  network_object: { $ref: "#/components/schemas/NetworkObject" }
                  task: { $ref: "#/components/schemas/OperationTask" }
  /api/v1/network-objects/{objectId}/diagnostics:
    get:
      summary: Return authoritative runtime diagnostics including NAT helper ownership
      operationId: getNetworkObjectDiagnostics
      parameters:
        - name: objectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runtime-specific diagnostics
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "409":
          description: Runtime diagnostics are unavailable
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    ReleaseIdentity:
      type: object
      additionalProperties: false
      required: [version, candidate_id, contract_digest]
      properties:
        version: { type: string }
        candidate_id: { type: string }
        binary_digest:
          type: [string, "null"]
          pattern: "^sha256:[a-f0-9]{64}$"
        contract_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        built_at: { type: [string, "null"], format: date-time }
    RuntimeCapabilityObservation:
      type: object
      additionalProperties: false
      required: [node_id, capability, revision, state, required, observed_at]
      properties:
        node_id: { type: string }
        capability:
          enum: [image, bootstrap, qmp, qga, serial, vnc, hotplug, guest_exec, port_mapping]
        revision: { type: integer, minimum: 1 }
        state: { enum: [unknown, probing, ready, unavailable, failed] }
        required: { type: boolean }
        details: { type: object, additionalProperties: true }
        problem: { $ref: "#/components/schemas/Problem" }
        observed_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        resource_type: { type: string }
        resource_id: { type: string }
        task_id: { type: string }
        phase: { type: string }
        cleanup: { type: string }
        operator_hint: { type: string }
        retry_after_seconds: { type: integer, minimum: 0 }
    OperationTask:
      type: object
      required: [id, kind, resource_type, resource_id, state, progress_current, progress_total, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        state: { enum: [queued, running, succeeded, failed, cancelled] }
        progress_current: { type: integer, minimum: 0 }
        progress_total: { type: integer, minimum: 0 }
        result: { type: object, additionalProperties: true }
        error: { $ref: "#/components/schemas/Problem" }
        created_at: { type: string, format: date-time }
    NetworkObject:
      type: object
      required: [id, laboratory_id, name, kind, revision, desired_state, observed_state, config]
      properties:
        id: { type: string }
        laboratory_id: { type: string }
        name: { type: string }
        kind: { enum: [bridge, nat_bridge, pc, switch_l2, switch_l3] }
        revision: { type: integer, minimum: 1 }
        desired_state: { type: string }
        observed_state: { enum: [provisioning, active, degraded, failed, deleting] }
        last_error: { $ref: "#/components/schemas/Problem" }
        config: { type: object, additionalProperties: true }
