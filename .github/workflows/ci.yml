name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: go mod download
      - run: cd web && npm ci
      - run: go vet ./...
      - run: go test ./...
      - run: cd web && npm run lint && npm test && npm run build
      - run: go test ./tests/contract/... ./tests/integration/... || test $? -eq 1
